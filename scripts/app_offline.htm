<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Em actualização</title>
    <style>
        :root { color-scheme: light dark; --fundo: #F2F4F7; --cartao: #FFFFFF; --texto: #16202C; --suave: #5A6676; --borda: #E0E5EB; }
        @media (prefers-color-scheme: dark) { :root { --fundo: #0D1116; --cartao: #151A21; --texto: #E7ECF2; --suave: #9DA8B6; --borda: #27303B; } }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: var(--fundo); color: var(--texto);
               font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { max-width: 420px; padding: 2rem; border: 1px solid var(--borda); border-radius: 14px; background: var(--cartao); text-align: center; }
        h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
        p { margin: 0; color: var(--suave); }
    </style>
</head>
<body>
    <main>
        <h1>O sistema está a ser actualizado</h1>
        <p>Volta a estar disponível dentro de alguns minutos. Os documentos e dados não são afectados.</p>
    </main>
</body>
</html>
